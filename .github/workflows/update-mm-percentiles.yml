name: Update MM Percentiles

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute daily version
        id: toc_version
        run: |
          BASE_VERSION="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -Ev -- '-[0-9]{8}$' | head -n 1 || true)"
          if [ -n "${BASE_VERSION}" ]; then
            VERSION="$(python3 tools/update_toc_version.py --daily --print-only --base-version "${BASE_VERSION}")"
          else
            VERSION="$(python3 tools/update_toc_version.py --daily --print-only)"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Create local daily tag
        id: tag_build
        run: |
          TAG="v${{ steps.toc_version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists."
            echo "tag_created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git tag "${TAG}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "tag_created=true" >> "${GITHUB_OUTPUT}"

      - name: Update TOC version
        if: steps.tag_build.outputs.tag_created == 'true'
        run: python3 tools/update_toc_version.py --version "${{ steps.tag_build.outputs.tag }}"

      - name: Generate percentile data
        if: steps.tag_build.outputs.tag_created == 'true'
        run: python3 tools/update_mm_percentiles.py

      - name: Stage generated package files
        if: steps.tag_build.outputs.tag_created == 'true'
        run: |
          test -s data/mm_percentiles.lua
          git add -f kaldo_tweaks.toc data/mm_percentiles.lua

      - name: Package and publish
        if: steps.tag_build.outputs.tag_created == 'true'
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      - name: Push daily tag
        if: steps.tag_build.outputs.tag_created == 'true'
        run: git push origin "${{ steps.tag_build.outputs.tag }}"
